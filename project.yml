title: "spaCy Intent Classification (Transformer)"
description: "End-to-end spaCy project: data conversion, training, evaluation, packaging, and simple inference."
spacy_version: ">=3.7.0,<4.0.0"

directories:
  - assets
  - configs
  - training
  - packages
  - app
  - data

vars:
  config: "configs/config_trf.cfg"
  train_jsonl: "assets/train.jsonl"
  dev_jsonl: "assets/dev.jsonl"
  test_jsonl: "assets/test.jsonl"
  train_spacy: "assets/train.spacy"
  dev_spacy: "assets/dev.spacy"
  test_spacy: "assets/test.spacy"
  output_dir: "training/model"
  package_dir: "packages"

assets: []

commands:
  - name: convert-data
    help: "Convert JSONL data with cats into .spacy binary format."
    script:
      - "python -m spacy convert ${vars.train_jsonl} assets/ --n-sents 0 --label TEXTCAT --converter jsonl"
      - "python -m spacy convert ${vars.dev_jsonl} assets/ --n-sents 0 --label TEXTCAT --converter jsonl"
      - "python -m spacy convert ${vars.test_jsonl} assets/ --n-sents 0 --label TEXTCAT --converter jsonl"

  - name: train
    help: "Train the transformer + textcat model."
    script:
      - "python -m spacy train ${vars.config} --output ${vars.output_dir} --paths.train ${vars.train_spacy} --paths.dev ${vars.dev_spacy}"

  - name: evaluate
    help: "Evaluate model on test set."
    script:
      - "python -m spacy evaluate ${vars.output_dir}/model-best ${vars.test_spacy} --output ${vars.output_dir}/metrics.json"

  - name: package
    help: "Package the trained model."
    script:
      - "python -m spacy package ${vars.output_dir}/model-best ${vars.package_dir} --name intent_trf --version 0.0.1"

  - name: app-setup
    help: "Copy best model into app directory for inference."
    script:
      - "python -c \"import shutil, pathlib; src = pathlib.Path('${vars.output_dir}')/'model-best'; dst = pathlib.Path('app')/'model'; shutil.rmtree(dst, ignore_errors=True); shutil.copytree(src, dst)\""

workflows:
  all:
    - convert-data
    - train
    - evaluate
    - package
    - app-setup
